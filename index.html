<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simulation d'Évolution</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <h1>Simulation d'Évolution</h1>
        <p style="text-align:center;margin:-15px 0 25px 0">
            <a href="invest.html" style="color:#00d4ff;text-decoration:none">&rarr; Voir aussi : Simulateur d'investissement financier</a>
        </p>
        
        <div class="controls">
            <div class="control-group">
                <label for="gridSize">Taille de la grille:</label>
                <input type="number" id="gridSize" min="10" max="100" value="50">
            </div>
            
            <div class="control-group">
                <label for="initialCreatures">Créatures initiales:</label>
                <input type="number" id="initialCreatures" min="1" max="100" value="20">
            </div>
            
            <div class="control-group">
                <label for="mutationRate">Taux de mutation:</label>
                <input type="range" id="mutationRate" min="0" max="100" value="10">
                <span id="mutationRateValue">10%</span>
            </div>
            
            <div class="control-group">
                <label for="simSpeed">Vitesse de simulation:</label>
                <input type="range" id="simSpeed" min="1" max="10" value="5">
                <span id="simSpeedValue">5</span>
            </div>
            
            <button id="startBtn">Démarrer</button>
            <button id="pauseBtn" disabled>Pause</button>
            <button id="resetBtn">Réinitialiser</button>
            <button id="stepBtn">Tour suivant</button>
        </div>
        
        <div class="simulation-info">
            <div class="info-item">
                <span class="info-label">Tour:</span>
                <span id="dayCounter">0</span>
            </div>
            <div class="info-item">
                <span class="info-label">Créatures:</span>
                <span id="creatureCount">0</span>
            </div>
            <div class="info-item">
                <span class="info-label">Moyenne d'âge:</span>
                <span id="avgAge">0</span>
            </div>
            <div class="info-item">
                <span class="info-label">Moyenne d'énergie:</span>
                <span id="avgEnergy">0</span>
            </div>
            <div class="info-item">
                <span class="info-label">Biome dominant:</span>
                <span id="dominantBiome">-</span>
            </div>
        </div>
        
        <div class="canvas-container">
            <canvas id="simulationCanvas"></canvas>
        </div>
        
        <div class="stats-panel">
            <h3>Statistiques des créatures</h3>
            <canvas id="statsCanvas"></canvas>
        </div>
        
        <div class="legend">
            <h3>Légende</h3>
            <div class="legend-items" id="legendItems">
                <!-- Les éléments de légende seront ajoutés dynamiquement -->
            </div>
        </div>
    </div>
    
    <script src="js/Environment.js"></script>
    <script src="js/Creature.js"></script>
    <script src="js/Simulation.js"></script>
    <script src="js/Renderer.js"></script>
    <script src="js/main.js"></script>
</body>
</html>
